  .release strong { font-size: 17px; letter-spacing: .08em; }
  .release span { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  nav { width: 100%; margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  nav a { display: block; text-align: center; padding: 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--fg); text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: .14em; transition: background .2s, border-color .2s; }
  nav a:hover, nav a:focus-visible, .release:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.35); }
